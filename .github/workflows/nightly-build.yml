name: Run nightly tests on Kedro

on:
  workflow_dispatch:
  schedule:
    # Run every day at midnight (UTC time)
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  kedro-main-test:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger and wait for all-checks on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          before=$(date -u +%s)
          gh workflow run all-checks.yml --ref "$TARGET_BRANCH" --repo "$REPO"

          run_id=""
          for _ in $(seq 1 30); do
            sleep 2
            run_id=$(gh run list --repo "$REPO" --workflow all-checks.yml \
              --branch "$TARGET_BRANCH" --event workflow_dispatch \
              --json databaseId,createdAt \
              --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${before})] | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched all-checks.yml run on $TARGET_BRANCH" >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$REPO" --exit-status

  kedro-develop-test:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger and wait for all-checks on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: develop
        run: |
          set -euo pipefail
          before=$(date -u +%s)
          gh workflow run all-checks.yml --ref "$TARGET_BRANCH" --repo "$REPO"

          run_id=""
          for _ in $(seq 1 30); do
            sleep 2
            run_id=$(gh run list --repo "$REPO" --workflow all-checks.yml \
              --branch "$TARGET_BRANCH" --event workflow_dispatch \
              --json databaseId,createdAt \
              --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${before})] | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched all-checks.yml run on $TARGET_BRANCH" >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$REPO" --exit-status

  notify-main:
    permissions:
      issues: write
    name: Notify failed build for kedro-main
    needs: kedro-main-test
    if: ${{ !success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: jayqi/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: "main nightly build"
          title-template: "ci: Nightly build failure on `main`"
          body-template: |
            GitHub Actions workflow [{{workflow}} #{{runNumber}}](https://github.com/{{repo.owner}}/{{repo.repo}}/actions/runs/{{runId}}) failed.
          create-label: true
          always-create-new-issue: false

  notify-develop:
    permissions:
      issues: write
    name: Notify failed build for kedro-develop
    needs: kedro-develop-test
    if: ${{ !success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: jayqi/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: "develop nightly build"
          title-template: "ci: Nightly build failure on `develop`"
          body-template: |
            GitHub Actions workflow [{{workflow}} #{{runNumber}}](https://github.com/{{repo.owner}}/{{repo.repo}}/actions/runs/{{runId}}) failed.
          create-label: true
          always-create-new-issue: false
