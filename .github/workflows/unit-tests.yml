name: Run unit-tests on Kedro

on:
  workflow_call:
    inputs:
      os:
        type: string
      python-version:
        type: string
      branch:
        type: string
        default: ''

jobs:
  unit-tests:
    permissions:
      contents: read
    runs-on: ${{ inputs.os }}
    timeout-minutes: 56 # equal to max + 3*std over the last ~1000 successful runs
    steps:
      - name: Validate branch input
        if: inputs.branch != ''
        run: |
          case "${{ inputs.branch }}" in
            main|develop) ;;
            *) echo "::error::Disallowed branch input: ${{ inputs.branch }}"; exit 1 ;;
          esac
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - name: Install the latest version of uv with Python ${{inputs.python-version}}
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ inputs.python-version }}
          activate-environment: true
      - name: Install dependencies
        run: |
            make install-test-requirements
            make install-pre-commit
      - name: pip freeze
        run: uv pip freeze
      - name: Run unit tests
        run: make test
