# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

  # `build.commands` fully overrides the default builder so that Zensical
  # produces the published site.
  commands:
    - pip install uv
    - uv pip install --system .[docs]
    - zensical build --clean
    # Publish the Zensical site to the Read the Docs output directory.
    - mkdir --parents $READTHEDOCS_OUTPUT/html
    - cp --recursive site/. $READTHEDOCS_OUTPUT/html

search:
  ranking:
    # Push API docs in the /api directory down the ranking
    api/*: -5
