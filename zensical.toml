# -------------------------
# theme
# -------------------------
[project.theme]
language = "en"
custom_dir = "docs/overrides"
variant = "classic"
favicon = "https://kedro.org/images/favicon.ico"
logo = "assets/kedro_logo_black.svg"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.tracking",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.tabs.link",
  "content.code.annotation",
  "content.code.copy",
  "content.code.annotate",
  "content.code.highlight"
]

[project.theme.font]
text = "Inter"
code = "Inter Regular"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
note = "octicons/note-16"
tip = "octicons/info-16"
warning = "octicons/alert-16"
example = "octicons/code-16"

[[project.theme.palette]]
scheme = "light"
toggle.icon = "material/white-balance-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "dark"
toggle.icon = "material/white-balance-sunny"
toggle.name = "Switch to light mode"

# -------------------------
# markdown_extensions
# -------------------------
[project.markdown_extensions.attr_list]

[project.markdown_extensions.mkdocs-click]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.tables]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.toc]
permalink = true
title = "Contents"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.superfences]

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

# -------------------------
# plugins
# -------------------------
[project.plugins.search]

[project.plugins.autorefs]

[project.plugins.redirects.redirect_maps]
"configuration/telemetry.md" = "about/telemetry.md"
"configure/advanced_configuration.md" = "configure/how_to_configure_project.md"
"configure/parameters.md" = "configure/parameters_and_credentials.md"
"configure/credentials.md" = "configure/parameters_and_credentials.md"
"configure/parameter_validation.md" = "configure/how_to_use_parameters_and_credentials.md"
"catalog-data/advanced_data_catalog_usage.md" = "catalog-data/how_to_access_the_data_catalog_in_code.md"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.kedro.org/en/stable/objects.inv",
  "https://docs.kedro.org/projects/kedro-datasets/en/stable/objects.inv"
]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_toc_entry = true
show_source = false
docstring_style = "google"
merge_init_into_class = true
docstring_section_style = "list"
separate_signature = true
show_root_heading = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true
warn_unknown_params = false
returns_named_value = false

# -------------------------
# Unsupported in Zensical (as of 0.0.60), handled elsewhere or dropped:
#   - mkdocs-mermaid2-plugin: mermaid renders natively via the classic theme /
#     the superfences custom fence above, so the plugin is not needed.
#   - mkdocs-llmstxt: no Zensical equivalent yet (tracked in zensical/backlog#83).
#     llms.txt / llms-full.txt are still generated via a secondary `mkdocs build`
#     driven by mkdocs.yml. Remove once native support lands.
#   - validation (omitted_files / absolute_links / unrecognized_links / anchors):
#     not yet supported. Internal link breakage is not caught at build time;
#     external links are still checked by the linkcheck CI job (lychee).
#   - not_in_nav: not supported; pages outside the nav are simply built.
# -------------------------
